# Background services. "Manual" means the service still starts when something needs it.

[[tweak]]
id = "svc-maps"
name = "Set Downloaded Maps Manager to manual"
description = "Only needed for offline maps. Starts when needed."
level = "light"
services = [{ name = "MapsBroker", startup = "Manual", default = "AutomaticDelayed" }]

[[tweak]]
id = "svc-retail-demo"
name = "Disable Retail Demo"
description = "Store display mode for PCs in shops."
level = "light"
services = [{ name = "RetailDemo", startup = "Disabled", default = "Manual" }]

[[tweak]]
id = "svc-storage"
name = "Set Storage Service to manual"
description = "Handles Storage Sense and app install locations."
level = "medium"
services = [{ name = "StorSvc", startup = "Manual", default = "Automatic" }]

[[tweak]]
id = "svc-link-tracking"
name = "Set Distributed Link Tracking to manual"
description = "Keeps shortcuts working when files move between network PCs."
level = "medium"
services = [{ name = "TrkWks", startup = "Manual", default = "Automatic" }]

[[tweak]]
id = "svc-offline-files"
name = "Disable Offline Files"
description = "Caches files from network shares for offline use, which home PCs rarely do."
level = "medium"
services = [{ name = "CscService", startup = "Disabled", default = "Manual" }]

[[tweak]]
id = "svc-fax"
name = "Disable Fax"
description = "Sends and receives faxes."
level = "medium"
services = [{ name = "Fax", startup = "Disabled", default = "Manual" }]

[[tweak]]
id = "svc-ai-fabric"
name = "Set AI Fabric Service to manual"
description = "Runs local AI models for Windows AI features. Set to start on demand. Windows 11 24H2 and later."
level = "light"
services = [{ name = "WSAIFabricSvc", startup = "Manual", default = "Automatic" }]

[[tweak]]
id = "svc-sysmain"
name = "Disable SysMain (Superfetch)"
description = "Preloads apps into RAM. The RAM it uses is cache that is freed on demand, so this mostly lowers background disk use. Also turns off memory compression, which hurts PCs with 8 GB or less."
level = "aggressive"
services = [{ name = "SysMain", startup = "Disabled", default = "Automatic" }]

[[tweak]]
id = "svc-search"
name = "Disable Windows Search indexing"
description = "Stops the file indexer. Start, Settings and Outlook search become slow. Only for people who use a tool like Everything."
level = "aggressive"
services = [{ name = "WSearch", startup = "Disabled", default = "AutomaticDelayed" }]

[[tweak]]
id = "svc-print"
name = "Disable Print Spooler"
description = "Breaks printing, including Print to PDF. Only if you never print."
level = "aggressive"
services = [{ name = "Spooler", startup = "Disabled", default = "Automatic" }]

[[tweak]]
id = "svc-ics"
name = "Disable Internet Connection Sharing"
description = "Breaks Mobile hotspot and the Hyper-V default network switch. Only if you use neither."
level = "aggressive"
services = [{ name = "SharedAccess", startup = "Disabled", default = "Manual" }]

[[tweak]]
id = "svc-cdp"
name = "Set Connected Devices Platform to manual"
description = "Breaks Nearby Sharing, Phone Link and syncing with other devices."
level = "aggressive"
services = [{ name = "CDPSvc", startup = "Manual", default = "AutomaticDelayed" }]

[[tweak]]
id = "svc-diagnostics"
name = "Set Diagnostic Policy Service to manual"
description = "Detects problems for the troubleshooters. Also stops per-app battery and data usage history and Task Manager's App history."
level = "aggressive"
services = [{ name = "DPS", startup = "Manual", default = "Automatic" }]

[[tweak]]
id = "app-onedrive"
name = "OneDrive"
description = "Uninstalls OneDrive. Files already in your OneDrive folder stay on disk, but stop syncing."
level = "aggressive"
apply = '''
Stop-Process -Name OneDrive -Force -ErrorAction SilentlyContinue
$setup = Get-Item "$env:LOCALAPPDATA\Microsoft\OneDrive\*\OneDriveSetup.exe", "$env:SystemRoot\System32\OneDriveSetup.exe", "$env:SystemRoot\SysWOW64\OneDriveSetup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
if (-not $setup) { throw 'OneDrive setup not found' }
Start-Process $setup.FullName '/uninstall' -Wait
'''
check = '''
-not (Test-Path "$env:LOCALAPPDATA\Microsoft\OneDrive\OneDrive.exe") -and -not (Test-Path "$env:ProgramFiles\Microsoft OneDrive\OneDrive.exe")
'''

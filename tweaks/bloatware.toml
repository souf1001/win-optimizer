[[tweak]]
id = "app-onedrive"
name = "Remove OneDrive"
description = "Uninstalls OneDrive. Local files stay, but files that only live in the cloud become unreachable here. Refuses to run while Desktop or Documents are backed up to OneDrive."
level = "aggressive"
apply = '''
$folders = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders'
if ("$($folders.Desktop) $($folders.Personal) $($folders.'My Pictures')" -match 'OneDrive') {
    throw 'Desktop, Documents or Pictures are backed up to OneDrive. Stop the backup in OneDrive settings first.'
}
$local = Get-KnownFolder LocalApplicationData
$windows = Get-KnownFolder Windows
$setup = Get-Item "$windows\System32\OneDriveSetup.exe", "$windows\SysWOW64\OneDriveSetup.exe", "$local\Microsoft\OneDrive\*\OneDriveSetup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
if (-not $setup) { throw 'OneDrive setup not found' }
# The per-user copy sits in a folder the user can write to. Copy it into a folder only admins
# can write to, so nothing can be swapped or planted next to it, then check who signed it.
$safe = Join-Path "$windows\Temp" "WinOptimizer-$([guid]::NewGuid())"
$acl = New-Object Security.AccessControl.DirectorySecurity
$acl.SetAccessRuleProtection($true, $false)
foreach ($sid in 'S-1-5-18', 'S-1-5-32-544') {
    $account = New-Object Security.Principal.SecurityIdentifier $sid
    $acl.AddAccessRule((New-Object Security.AccessControl.FileSystemAccessRule $account, 'FullControl', 'ContainerInherit, ObjectInherit', 'None', 'Allow'))
}
[IO.Directory]::CreateDirectory($safe, $acl) | Out-Null
try {
    $copy = Join-Path $safe 'OneDriveSetup.exe'
    [IO.File]::Copy($setup.FullName, $copy)
    $signature = Get-AuthenticodeSignature $copy
    if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
        throw "Refusing to run $($setup.FullName): not signed by Microsoft"
    }
    Stop-Process -Name OneDrive -Force -ErrorAction SilentlyContinue
    $process = Start-Process $copy '/uninstall' -PassThru
    if (-not $process.WaitForExit(10 * 60 * 1000)) { $process.Kill(); throw 'OneDrive setup did not finish within 10 minutes' }
} finally {
    Remove-Item -LiteralPath $safe -Recurse -Force -ErrorAction SilentlyContinue
}
'''
check = '''
-not (Test-Path "$(Get-KnownFolder LocalApplicationData)\Microsoft\OneDrive\OneDrive.exe") -and -not (Test-Path "$env:ProgramFiles\Microsoft OneDrive\OneDrive.exe")
'''

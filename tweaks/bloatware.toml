apps = ["Microsoft.People", "Microsoft.Messaging", "Microsoft.SkypeApp", "Microsoft.MixedReality.Portal", "Microsoft.Microsoft3DViewer", "Microsoft.Print3D", "Microsoft.3DBuilder", "Microsoft.MSPaint", "Microsoft.OneConnect", "Microsoft.Wallet", "Microsoft.Office.OneNote", "Microsoft.Office.Sway", "Microsoft.549981C3F5F10", "Microsoft.NetworkSpeedTest", "Microsoft.MicrosoftPowerBIForWindows"]

[[tweak]]
id = "app-clipchamp"
name = "Clipchamp"
description = "Web-based video editor with a paid tier."
level = "light"
apps = ["Clipchamp.Clipchamp"]

[[tweak]]
id = "app-family"

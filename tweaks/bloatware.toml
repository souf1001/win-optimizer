[[tweak]]
id = "app-game-bar"
name = "Remove Xbox Game Bar"
description = "The Win+G overlay with its recorder and performance widgets. Also stops games from showing a \"You'll need a new app\" popup afterwards."
level = "aggressive"
apps = ["Microsoft.XboxGamingOverlay", "Microsoft.XboxGameOverlay"]
apply = '''
# Point the Game Bar links at a harmless system app so Windows doesn't ask for the Store.
foreach ($name in 'ms-gamebar', 'ms-gamebarservices', 'ms-gamingoverlay') {
    $key = "HKLM:\SOFTWARE\Classes\$name"
    Set-Reg $key '(Default)' String "URL:$name"
    Set-Reg $key 'URL Protocol' String ''
    Set-Reg $key 'NoOpenWith' String ''
    Set-Reg "$key\shell\open\command" '(Default)' ExpandString '%SystemRoot%\System32\systray.exe'
}
'''


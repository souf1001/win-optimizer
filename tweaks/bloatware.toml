# Preinstalled apps. Removal covers all users and the provisioned copy, so new
# user accounts don't get them either. Apps can be reinstalled from the Microsoft Store.
# Levels: light = nobody misses it, medium = some people use it, aggressive = may break things.

[[tweak]]
id = "app-bing"
name = "Remove Bing News, Finance and Sports"
description = "Ad-supported news feeds that refresh in the background."
level = "light"
apps = ["Microsoft.BingNews", "Microsoft.BingFinance", "Microsoft.BingSports", "Microsoft.BingTravel", "Microsoft.BingFoodAndDrink", "Microsoft.BingHealthAndFitness", "Microsoft.BingTranslator", "Microsoft.BingSearch", "Microsoft.News"]


description = "Parental controls app. Family settings in your Microsoft account keep working."
level = "light"
apps = ["MicrosoftCorporationII.MicrosoftFamily"]

[[tweak]]
id = "app-power-automate"
name = "Power Automate"
description = "Desktop automation tool aimed at businesses."
level = "light"
apps = ["Microsoft.PowerAutomateDesktop"]

[[tweak]]
id = "app-devhome"
name = "Dev Home"
description = "Discontinued developer dashboard."
level = "light"
apps = ["Microsoft.Windows.DevHome"]

[[tweak]]
id = "app-teams-personal"
name = "Teams (personal) and Chat"
description = "The consumer Teams app that Windows 11 pins to the taskbar."
level = "light"
apps = ["MicrosoftTeams"]

[[tweak]]
id = "app-journal"
name = "Journal"
description = "Pen note-taking app."
level = "light"
apps = ["Microsoft.MicrosoftJournal"]

[[tweak]]
id = "app-pc-manager"
name = "PC Manager"
description = "Microsoft's own cleanup tool. Redundant next to this app."
level = "light"
apps = ["Microsoft.PCManager"]

[[tweak]]
id = "block-auto-install"
name = "Block automatic install of Outlook and Dev Home"
description = "Windows Update reinstalls new Outlook and Dev Home after you remove them. This marks those installs as done."
level = "light"
apply = '''
foreach ($name in 'OutlookUpdate', 'DevHomeUpdate') {
    $path = "HKLM:\SOFTWARE\Microsoft\WindowsUpdate\Orchestrator\UScheduler_Oobe\$name"
    if (Test-Path $path) { Set-Reg $path 'workCompleted' DWord 1 }
}
'''
check = '''
$keys = 'OutlookUpdate', 'DevHomeUpdate' | ForEach-Object { "HKLM:\SOFTWARE\Microsoft\WindowsUpdate\Orchestrator\UScheduler_Oobe\$_" }
@($keys | Where-Object { (Test-Path $_) -and -not (Test-Reg $_ 'workCompleted' 1) }).Count -eq 0
'''

[[tweak]]
id = "block-oem-installers"
name = "Block OEM firmware installers"
description = "Stops the PC firmware (WPBT) from injecting vendor tools like Armoury Crate or Lenovo Vantage at boot. Install drivers yourself instead."
level = "medium"
restart = true
registry = [
  { path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager', name = 'DisableWpbtExecution', value = 1 },
]

[[tweak]]

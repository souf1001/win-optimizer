# FPS, frame pacing and input.

[[tweak]]
id = "game-mode"
name = "Enable Game Mode"
description = "Game Mode pauses Windows Update and driver installs while you play and prioritizes the game. On by default; this makes sure it stays on."
level = "light"
registry = [
  { path = 'HKCU:\Software\Microsoft\GameBar', name = 'AutoGameModeEnabled', value = 1 },
  { path = 'HKCU:\Software\Microsoft\GameBar', name = 'AllowAutoGameMode', value = 1 },
]

[[tweak]]
id = "windowed-optimizations"
name = "Enable windowed game optimizations"
description = "DirectX 10 and 11 games in borderless or windowed mode get the same low latency as fullscreen, and VRR works there too. Windows 11 only."
level = "light"
apply = "Set-DirectXSetting 'SwapEffectUpgradeEnable' '1'"
revert = "Set-DirectXSetting 'SwapEffectUpgradeEnable' $null"
check = "(Get-ItemProperty 'HKCU:\\Software\\Microsoft\\DirectX\\UserGpuPreferences' -ErrorAction SilentlyContinue).DirectXUserGlobalSettings -match 'SwapEffectUpgradeEnable=1'"

[[tweak]]
id = "sticky-keys"
name = "Disable Sticky Keys shortcuts"
description = "Pressing Shift five times (or holding it) no longer pops up Sticky, Filter or Toggle Keys in the middle of a game."
level = "light"
registry = [
  { path = 'HKCU:\Control Panel\Accessibility\StickyKeys', name = 'Flags', type = "String", value = '506', default = '510' },
  { path = 'HKCU:\Control Panel\Accessibility\Keyboard Response', name = 'Flags', type = "String", value = '122', default = '126' },
  { path = 'HKCU:\Control Panel\Accessibility\ToggleKeys', name = 'Flags', type = "String", value = '58', default = '62' },
]

[[tweak]]
id = "game-bar"
name = "Disable Game Bar and game recording"
description = "Turns off the Win+G overlay and all game and screen recording, including Win+Alt+R. Use this if you record with Steam, NVIDIA or AMD instead."
level = "medium"
registry = [
  { path = 'HKCU:\System\GameConfigStore', name = 'GameDVR_Enabled', value = 0, default = 1 },
  { path = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\GameDVR', name = 'AppCaptureEnabled', value = 0 },
  { path = 'HKCU:\Software\Microsoft\GameBar', name = 'UseNexusForGameBarEnabled', value = 0 },
  { path = 'HKCU:\Software\Microsoft\GameBar', name = 'ShowStartupPanel', value = 0 },
  { path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\GameDVR', name = 'AllowGameDVR', value = 0 },
]

[[tweak]]
id = "hags"
name = "Enable hardware-accelerated GPU scheduling"
description = "Needed for DLSS and FSR Frame Generation. Otherwise little measurable effect. Already on for most new GPUs."
level = "medium"
restart = true
registry = [
  { path = 'HKLM:\SYSTEM\CurrentControlSet\Control\GraphicsDrivers', name = 'HwSchMode', value = 2 },
]

[[tweak]]
id = "mouse-acceleration"
name = "Disable mouse acceleration"
description = "Turns off \"Enhance pointer precision\" so the same hand movement always moves the cursor the same distance. Takes effect after sign-out."
level = "medium"
restart = true
registry = [
  { path = 'HKCU:\Control Panel\Mouse', name = 'MouseSpeed', type = "String", value = '0', default = '1' },
  { path = 'HKCU:\Control Panel\Mouse', name = 'MouseThreshold1', type = "String", value = '0', default = '6' },
  { path = 'HKCU:\Control Panel\Mouse', name = 'MouseThreshold2', type = "String", value = '0', default = '10' },
]

[[tweak]]
id = "usb-suspend"
name = "Disable USB selective suspend"
description = "USB devices are never put to sleep. Fixes mice, headsets and controllers that lag or disconnect for a moment. Uses a little more power."
level = "medium"
apply = "Set-PowerSetting '2a737441-1930-4402-8d77-b2bebba308a3' '48e6b7a6-50f5-4782-a5d4-53bb8f07e226' 0"
revert = "Set-PowerSetting '2a737441-1930-4402-8d77-b2bebba308a3' '48e6b7a6-50f5-4782-a5d4-53bb8f07e226' 1"
check = "Test-PowerSetting '2a737441-1930-4402-8d77-b2bebba308a3' '48e6b7a6-50f5-4782-a5d4-53bb8f07e226' 0"

[[tweak]]
id = "vbs"
name = "Disable Memory Integrity and VBS"
description = "The one tweak with a measurable FPS gain: 0-5% on most CPUs from 2018 on, 10-15% in some CPU-bound games, more on older CPUs. Lowers protection against kernel malware. No effect if VBS is locked in firmware."
level = "aggressive"
restart = true
registry = [
  { path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard', name = 'EnableVirtualizationBasedSecurity', value = 0 },
  { path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity', name = 'Enabled', value = 0, default = 1 },
]

[[tweak]]
id = "mpo"
name = "Disable Multiplane Overlay"
description = "Fixes flickering, black screens and stutter in browsers or on multi-monitor setups with some GPUs. Does not raise FPS."
level = "optional"
restart = true
registry = [
  { path = 'HKLM:\SOFTWARE\Microsoft\Windows\Dwm', name = 'OverlayTestMode', value = 5 },
  { path = 'HKLM:\SYSTEM\CurrentControlSet\Control\GraphicsDrivers', name = 'DisableOverlays', value = 1 },
]

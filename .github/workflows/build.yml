name: Build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Unit tests (definitions, PowerShell syntax)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # The runner is a throwaway Windows VM, so it is safe to really apply and revert tweaks here.
      - name: Apply, check and revert every tweak
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --ignored --nocapture

      - name: Build installer
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: win-optimizer-setup
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
